name: CI

on:
  pull_request:
  push:
    branches: [ master, main ]

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.15.8'
      - name: Terraform fmt
        run: |
          cd infra/relay
          terraform fmt -check
      - name: Terraform init
        run: |
          cd infra/relay
          terraform init -backend=false -input=false -lockfile=readonly
      - name: Terraform validate
        run: |
          cd infra/relay
          terraform validate

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r services/relay_lambda/requirements.txt
      - name: Run tests
        run: |
          pytest -q
