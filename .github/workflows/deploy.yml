name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

permissions:
  contents: read

concurrency:
  group: relay-dev-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TF_IN_AUTOMATION: 'true'
      TF_VAR_region: ${{ secrets.AWS_REGION }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.15.8'
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
          allowed-account-ids: '387344700059'
      - name: Terraform Init
        run: |
          cd infra/relay
          terraform init -input=false -lockfile=readonly
      - name: Terraform Validate
        working-directory: infra/relay
        run: terraform validate
      - name: Terraform Plan
        working-directory: infra/relay
        run: terraform plan -input=false -lock-timeout=5m -out=deploy.tfplan
      - name: Terraform Apply
        run: |
          cd infra/relay
          terraform apply -input=false -lock-timeout=5m deploy.tfplan
