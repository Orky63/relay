<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1090" viewBox="0 0 1280 1090" role="img" aria-labelledby="title description">
<title id="title">Relay — current architecture</title>
<desc id="description">A local demo portal is not yet connected to the AWS backend. API Gateway invokes Lambda, which stores and retrieves individual tickets in DynamoDB and writes logs to CloudWatch. EventBridge has a configured Lambda target. Cognito, an attachment bucket, and SNS are provisioned but not integrated into user workflows. GitHub Actions deploys Terraform, using a separate S3 state bucket.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#172b4d}.heading{font-size:23px;font-weight:700}.body{font-size:16px;fill:#475569}.label{font-size:14px;fill:#475569}.small{font-size:14px;fill:#64748b}.section{font-size:15px;font-weight:700;letter-spacing:1.4px;fill:#2563eb}.line{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}</style>
